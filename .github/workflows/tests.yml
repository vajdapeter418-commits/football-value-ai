name: Python regression and market research
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Install ephemeral PostgreSQL test prerequisites
        run: sudo apt-get update && sudo apt-get install -y postgresql openssl
      - name: Run full suite including isolated TLS PostgreSQL
        run: |
          export FVA_RUN_LOCAL_POSTGRES_TESTS=1
          export FVA_TEST_POSTGRES_BIN="$(pg_config --bindir)"
          python -m unittest discover -s tests -v
      - run: python -m compileall -q .
      - run: git diff --check HEAD^ HEAD

